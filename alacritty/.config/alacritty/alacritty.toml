[window]
padding = { x = 8, y = 8 } 
dynamic_padding = true 

[font]
size = 13

[font.normal]
family = "JetBrains Mono"
#family = "Iosevka"
#family = "Hack"
#family = "Cascadia Code"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "italic"

[scrolling]
history = 50000

[cursor]
style = { shape = "Beam", blinking = "On"}

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[terminal]
shell = "/bin/bash"
